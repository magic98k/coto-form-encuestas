<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Encuesta Coto</title>
<style>
  body { margin: 0; background: #f5f5f5; font-family: Arial, sans-serif; }
  .container { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  .logo { margin-bottom: 30px; }
  .logo iframe { border: 0; display: block; }
  .card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; }
  .form-group { margin-bottom: 24px; text-align: left; }
  .form-group label { display: block; margin-bottom: 10px; font-weight: bold; color: #333; }
  textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; min-height: 100px; resize: vertical; box-sizing: border-box; font-family: Arial, sans-serif; }

  /* Escala NPS */
  .nps-scale { display: flex; gap: 4px; justify-content: space-between; }
  .nps-scale input { display: none; }
  .nps-scale label {
    flex: 1;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 14px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    transition: 0.15s;
    border: 2px solid transparent;
  }

  /* Detractores 0-6: rojo, Pasivos 7-8: amarillo, Promotores 9-10: verde */
  .nps-scale label.detractor { background: #ff0000; }
  .nps-scale label.pasivo { background: #ffd400; }
  .nps-scale label.promotor { background: #2ee88a; }

  .nps-scale input:checked + label { border-color: #000; transform: scale(1.08); }
  .nps-labels { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-top: 6px; }

  button { background: #ff0000; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { background: #cc0000; }
  .thank-you { display: none; text-align: center; padding: 20px 0; }
  .thank-you .check { font-size: 64px; margin-bottom: 16px; }
  .thank-you h2 { color: #ff0000; font-size: 22px; margin-bottom: 10px; }
  .thank-you p { color: #555; font-size: 15px; line-height: 1.5; }
</style>
</head>
